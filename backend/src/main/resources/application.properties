server.port=8080
spring.application.name=voxa-backend

# Translation API Key (override via environment variable)
voxa.translation.api-key=${TRANSLATION_API_KEY:mock-key-for-now}

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:voxadb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable H2 Console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
